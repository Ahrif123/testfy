<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testfy · Test Case Manager for Manual QA</title>
  <meta name="description"
    content="Write test cases, run them step by step, attach screenshots and export Word test reports." />
    <script>
      // Apply the saved light/dark choice before the page paints
      try {
        var t = localStorage.getItem('testfy:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
